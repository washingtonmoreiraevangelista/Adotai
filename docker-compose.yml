# 🚀 Comandos principais
# bash
# Copiar
# Editar
# # Subir os containers
# docker-compose up --build

# # Subir em segundo plano
# docker-compose up -d

# # Acessar o container da app
# docker-compose exec app sh

# # Derrubar tudo
# docker-compose down
# 🧠 Resumo das principais palavras-chave do YML
# Palavra-chave	O que faz
# version	Versão do arquivo de orquestração do Docker Compose
# services	Define os serviços (API, banco, etc.)
# image	Imagem do container a ser usada
# build	Caminho onde está o Dockerfile
# ports	Mapeamento de portas do host para o container
# environment	Variáveis de ambiente (ex: credenciais)
# volumes	Monta diretórios persistentes ou espelhados
# depends_on	Define a ordem de dependência entre os serviços
# container_name	Nome personalizado do container Docker




version: '3.8'

services:

  Adotai:
    image: bitnami/postgresql
    ports:
      - "5433:5432"
    environment:
       - POSTGRESQL_USERNAME=docker
       - POSTGRESQL_PASSWORD=docker
       - POSTGRESQL_DATABASE=adotai
